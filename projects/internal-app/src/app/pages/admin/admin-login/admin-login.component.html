<div class="split-login-container">
  <div class="login-card">
    
    <!-- LEFT SIDE -->
    <div class="login-left">
      <div class="left-header">
        <div class="logo">
          <img src="assets/images/importadora-euro-logo-v2.webp" alt="Importadora Euro" style="height: 144px; width: auto;" loading="eager">
        </div>
        <a href="/" class="back-btn">Back to website &rarr;</a>
      </div>
      
      <div class="left-content">
        <h2>Command Center,<br>Secure Access</h2>
        <div class="slider-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">
      <div class="right-inner">
        <h1>Admin Portal</h1>
        <p class="subtitle">Secure access for staff and administrators.</p>

        <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()">
          <div class="form-group">
            <input type="email" formControlName="email" placeholder="Email address">
          </div>
          <div class="form-group pos-rel">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter your password">
            <span class="material-icons toggle-pwd" (click)="togglePassword()">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" checked>
              <span class="checkmark"></span>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">Sign In</button>
        </form>

        <div class="divider">
          <span>Or sign in with</span>
        </div>

        <div class="social-login">
          <button type="button" class="social-btn" (click)="loginWithGoogle()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
              <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
              <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
              <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
              <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
            </svg>
            Google
          </button>
        </div>
      </div>
    </div>
    
  </div>
</div>
