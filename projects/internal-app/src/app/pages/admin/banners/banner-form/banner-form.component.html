<app-admin-page-header icon="🖼️"
    [title]="isEditing ? ('ADMIN.BANNERS.EDIT_TITLE' | translate) : ('ADMIN.BANNERS.NEW_TITLE' | translate)"
    [showSaveCancel]="true" [hasUnsavedChanges]="bannerForm.dirty" [isFormInvalid]="bannerForm.invalid"
    (onSave)="onSubmit()" (onCancel)="onCancel()">
</app-admin-page-header>

<div class="form-container">
    <form [formGroup]="bannerForm" (ngSubmit)="onSubmit()" class="admin-form">
        <div class="form-group">
            <label>{{ 'ADMIN.BANNERS.FORM.TITLE' | translate }}</label>
            <input type="text" formControlName="title"
                [placeholder]="'ADMIN.BANNERS.FORM.TITLE_PLACEHOLDER' | translate">
        </div>

        <div class="form-group">
            <label>{{ 'ADMIN.BANNERS.FORM.SUBTITLE' | translate }}</label>
            <input type="text" formControlName="subtitle"
                [placeholder]="'ADMIN.BANNERS.FORM.SUBTITLE_PLACEHOLDER' | translate">
        </div>

        <div class="form-group">
            <label>{{ 'ADMIN.BANNERS.FORM.LINK' | translate }}</label>
            <input type="text" formControlName="link" placeholder="/catalog">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>{{ 'ADMIN.BANNERS.FORM.ORDER' | translate }}</label>
                <input type="number" formControlName="order">
            </div>

            <div class="form-group">
                <app-toggle-switch [control]="$any(bannerForm.get('active'))"
                    [label]="'ADMIN.BANNERS.FORM.ACTIVE' | translate" icon="✅">
                </app-toggle-switch>
            </div>
        </div>

        <div class="form-group pb-8">
            <label>{{ 'ADMIN.BANNERS.FORM.IMAGE' | translate }}</label>
            <div class="image-actions mb-4">
                <button type="button" class="btn-upload" (click)="fileInput.click()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <span>Upload Image</span>
                </button>

                <button type="button" class="btn-library" (click)="openMediaLibrary()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <span>Choose from Library</span>
                </button>
            </div>

            @if (previewUrl) {
            <div class="images-grid">
                <div class="image-card">
                    <div class="image-container-16x9">
                        <img [src]="previewUrl" alt="Preview">
                    </div>

                    <button type="button" class="btn-remove-card" (click)="removeImage()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
            }
            <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" style="display: none;">
        </div>
    </form>
</div>

<app-media-picker-dialog *ngIf="showMediaPicker" (assetSelected)="onMediaAssetSelected($event)"
    (close)="closeMediaPicker()">
</app-media-picker-dialog>
