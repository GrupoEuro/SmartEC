<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
    <!-- Chat Window -->
    @if (isOpen()) {
        <div class="bg-zinc-900 border border-zinc-700 shadow-2xl rounded-xl w-80 sm:w-96 mb-4 flex flex-col overflow-hidden transition-all duration-300 transform origin-bottom-right" style="height: 500px; max-height: 70vh;">
            <!-- Header -->
            <div class="bg-indigo-600 p-4 flex justify-between items-center text-white">
                <div class="flex items-center gap-2">
                    <app-icon name="cpu" [size]="20"></app-icon>
                    <div>
                        <h3 class="font-bold text-sm">EuroMind AI</h3>
                        <p class="text-[10px] text-indigo-200">Asistente Ejecutivo</p>
                    </div>
                </div>
                <button (click)="toggleChat()" class="text-indigo-200 hover:text-white transition-colors">
                    <app-icon name="x" [size]="20"></app-icon>
                </button>
            </div>

            <!-- Messages Area -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-zinc-800/50">
                @for (msg of messages(); track msg.timestamp) {
                    <div class="flex flex-col max-w-[85%]" [ngClass]="msg.role === 'user' ? 'self-end items-end ml-auto' : 'self-start items-start'">
                        <span class="text-[10px] text-zinc-500 mb-1 px-1">{{ msg.role === 'user' ? 'Tú' : 'EuroMind' }}</span>
                        <div class="p-3 rounded-lg text-sm" 
                             [ngClass]="msg.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-zinc-700 text-zinc-200 rounded-tl-none'">
                            <p class="whitespace-pre-wrap">{{ msg.content }}</p>
                        </div>
                    </div>
                }
                
                @if (isTyping()) {
                    <div class="self-start flex gap-1 items-center bg-zinc-700 p-3 rounded-lg rounded-tl-none max-w-[50%]">
                        <div class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                    </div>
                }
            </div>

            <!-- Input Area -->
            <div class="p-3 border-t border-zinc-700 bg-zinc-900">
                <form (submit)="$event.preventDefault(); sendMessage()" class="flex items-center gap-2">
                    <input type="text" [ngModel]="query()" (ngModelChange)="query.set($event)" name="query" 
                           placeholder="Pregunta a EuroMind..."
                           [disabled]="isTyping()"
                           class="flex-1 bg-zinc-800 border border-zinc-700 rounded-full px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <button type="submit" [disabled]="!query().trim() || isTyping()"
                            class="p-2 rounded-full bg-indigo-600 text-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-indigo-500 transition-colors">
                        <app-icon name="send" [size]="18"></app-icon>
                    </button>
                </form>
            </div>
        </div>
    }

    <!-- CTA Button -->
    <button (click)="toggleChat()" 
            class="group flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-5 py-3 rounded-full shadow-lg hover:shadow-indigo-500/25 transition-all duration-300 transform hover:-translate-y-1">
        <app-icon name="message-square" [size]="20"></app-icon>
        <span class="font-bold text-sm tracking-wide">Ask EuroMind</span>
        <!-- Ping animation -->
        <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-purple-500"></span>
        </span>
    </button>
</div>
