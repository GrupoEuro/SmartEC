<!-- Campañas Activas — diseño idéntico a las tarjetas del Operations Dashboard -->
<div class="bg-zinc-800 rounded-xl overflow-hidden shadow-lg border border-zinc-700 hover:shadow-xl transition-shadow">

    <!-- Header -->
    <div class="bg-zinc-900/50 p-4 border-b border-zinc-700 flex items-center justify-between cursor-pointer select-none"
         (click)="toggle()">
        <h3 class="flex items-center text-sm font-semibold uppercase tracking-wider text-zinc-300">
            <app-icon name="megaphone" [size]="18" class="mr-2 text-indigo-400"></app-icon>
            Campañas Activas
            <span *ngIf="!isLoading()"
                class="ml-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/20 normal-case tracking-normal">
                {{ campaigns().length }}
            </span>
        </h3>
        <div class="flex items-center gap-3">
            <a routerLink="/marketing/campaigns"
               (click)="$event.stopPropagation()"
               class="text-[11px] font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
                <app-icon name="external-link" [size]="11"></app-icon>
                Marketing Hub
            </a>
            <app-icon [name]="isCollapsed() ? 'chevron-down' : 'chevron-up'"
                [size]="14" class="text-zinc-500 transition-transform"></app-icon>
        </div>
    </div>

    <!-- Body -->
    <div *ngIf="!isCollapsed()" class="p-4">

        <!-- Loading -->
        <div *ngIf="isLoading()" class="flex items-center gap-2 text-sm text-zinc-500 py-2">
            <div class="w-4 h-4 border-2 border-zinc-700 border-t-indigo-500 rounded-full animate-spin"></div>
            Cargando campañas…
        </div>

        <!-- Empty -->
        <div *ngIf="!isLoading() && campaigns().length === 0"
             class="flex items-center gap-2 text-sm text-zinc-500 py-2">
            <app-icon name="info" [size]="16" class="text-zinc-600"></app-icon>
            Sin campañas activas en este momento.
        </div>

        <!-- Campaign pills -->
        <div *ngIf="!isLoading() && campaigns().length > 0" class="flex flex-wrap gap-2">
            <div *ngFor="let c of campaigns()"
                 class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border whitespace-nowrap"
                 [ngClass]="{
                    'bg-emerald-500/10 border-emerald-500/25 text-emerald-400': urgencyClass(daysLeft(c.endDate)) === 'safe',
                    'bg-amber-500/10  border-amber-500/25  text-amber-400':   urgencyClass(daysLeft(c.endDate)) === 'soon',
                    'bg-red-500/10    border-red-500/25    text-red-400':     urgencyClass(daysLeft(c.endDate)) === 'urgent'
                 }">
                <!-- Pulse dot -->
                <span class="w-1.5 h-1.5 rounded-full bg-current animate-pulse flex-shrink-0"></span>
                <span class="max-w-[180px] truncate">{{ c.name }}</span>
                <span class="opacity-80 font-bold text-[10px]">{{ daysLeft(c.endDate) }}d</span>
            </div>
        </div>

    </div>
</div>
