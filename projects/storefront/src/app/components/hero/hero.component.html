@if (hasActiveCampaign && slides.length > 0) {
<section class="hero-carousel-wrapper">

  <!-- Slides Track -->
  <div class="carousel-track" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">

    @for (slide of slides; track slide.index) {
    <div class="carousel-slide slide-banner"
         [class.slide-clickable]="!!slide.ctaUrl"
         (click)="onSlideClick(slide)">
      <img [src]="slide.imageUrl" [alt]="slide.ctaLabel || 'Campaign Slide'" class="banner-full-img" loading="eager">
      <div class="banner-overlay"></div>
      @if (slide.ctaUrl) {
        <div class="banner-cta-hint">{{ slide.ctaLabel || 'Ver más →' }}</div>
      }
    </div>
    }

  </div>

  <!-- Prev / Next Arrows (only if more than 1 slide) -->
  @if (slides.length > 1) {
  <button class="carousel-arrow carousel-prev" (click)="prev(); $event.stopPropagation()" aria-label="Anterior">&#8592;</button>
  <button class="carousel-arrow carousel-next" (click)="next(); $event.stopPropagation()" aria-label="Siguiente">&#8594;</button>

  <!-- Dot Navigation -->
  <div class="carousel-dots">
    @for (slide of slides; track slide.index) {
    <button class="carousel-dot"
            [class.active]="currentIndex === slide.index"
            (click)="goTo(slide.index); $event.stopPropagation()"
            [attr.aria-label]="'Slide ' + (slide.index + 1)">
    </button>
    }
  </div>
  }

</section>
}
