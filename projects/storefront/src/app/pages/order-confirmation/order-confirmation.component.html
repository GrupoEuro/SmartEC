<div class="confirmation-container">
    <div class="success-card glass-panel">
        <div class="icon-wrapper">
            <div class="check-circle pulse-animation">✓</div>
        </div>

        <div class="content">
            <h1>{{ 'ORDER_CONFIRMATION.TITLE' | translate }}</h1>
            <p class="order-id">{{ 'COMMON.ORDER_NUMBER' | translate }}{{ orderId ?? 'N/A' }}</p>

            @if (email) {
                <p class="message">
                    {{ 'ORDER_CONFIRMATION.EMAIL_SENT' | translate }}
                    <span class="highlight">{{ email }}</span>.
                </p>
            }

            <div class="actions">
                <a routerLink="/" class="btn-primary">
                    {{ 'ORDER_CONFIRMATION.RETURN_HOME' | translate }}
                </a>
                <a routerLink="/account/orders" class="btn-secondary">
                    {{ 'ORDER_CONFIRMATION.TRACK_ORDER' | translate }}
                </a>
            </div>
        </div>
    </div>
</div>
